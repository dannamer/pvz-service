version: "3.8"

services:
  db:
    image: postgres:13
    container_name: pvz-db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init-database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DATABASE_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d ${DATABASE_NAME}'"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - internal
    env_file:
      - .env
    
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pvz-service
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    networks:
      - internal

volumes:
  pgdata:
  
networks:
  internal: